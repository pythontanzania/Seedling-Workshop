<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Seedling{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #f6f7f2; }
        header { display: flex; justify-content: space-between; align-items: center; }
        header a { color: #1b5e20; text-decoration: none; font-weight: bold; }
        .card { background: white; border-radius: 8px; padding: 16px; margin: 12px 0; }
        .bar { background: #e0e0e0; border-radius: 8px; height: 20px; }
        .fill { background: #2e7d32; height: 20px; border-radius: 8px; }
        .button { background: #2e7d32; color: white; padding: 8px 14px; border: none; border-radius: 6px; text-decoration: none; }
        .paid { color: #2e7d32; }
        .errorlist { color: #c62828; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'home' %}">Seedling</a>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <a href="{% url 'manage' %}">Manage</a>
                <button type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Organiser login</a>
        {% endif %}
    </header>
    {% block content %}{% endblock %}
</body>
</html>
